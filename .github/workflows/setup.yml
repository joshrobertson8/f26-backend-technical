name: Check events setup

on:
  push:
    branches: [main, "JR/setup-check-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: events workspace
    steps:
      - uses: actions/checkout@v4
        with:
          path: events workspace

      - name: Install and check tools on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          unset JAVA_HOME CC
          for option in python-fastapi javascript-express typescript-express javascript-nextjs typescript-nextjs java-spring-boot c; do
            ./setup/setup.sh "$option"
            source setup/.tools/activate.sh
            python3 setup/check.py "$option"
            ./setup/setup.sh "$option"
          done
          python3 -m unittest discover -s setup/tests -v

