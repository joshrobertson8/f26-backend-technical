name: Check events setup

on:
  push:
    branches: [main, "JR/setup-check-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: events workspace
    steps:
      - uses: actions/checkout@v4
        with:
          path: events workspace

